<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>部署一覧</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: "Segoe UI", "Noto Sans JP", sans-serif;
            background-color: var(--gray-100);
            margin: 40px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }


        /* ===== テーブル ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            margin: 20px auto;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        th,
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--gray-300);
            text-align: center;
            vertical-align: middle;
        }


        /* ===== ボタン共通 ===== */
        .btn {
            padding: 6px 14px;
            border-radius: 9999px;
            /* 丸い */
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            color: #fff;
        }

        .btn-primary {
            background: var(--primary);
        }

        .btn-edit {
            background-color: #6c757d;
        }

        .btn-edit:hover {
            background-color: #545b62;
        }

        .btn-delete {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
        }


        .btn:hover {
            opacity: 0.85;
        }

        tr:hover {
            background-color: #f9fafb;
        }


        /* 操作ボタン横並び */
        .action-links {
            display: flex;
            justify-content: center;
            gap: 10px;
        }


        /* フッター */
        .footer-link {
            margin-top: 20px;
            display: inline-block;
        }

        .footer-link a {
            color: #0d6efd;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --gray-100: #f8fafc;
            --gray-300: #e5e7eb;
            --gray-600: #4b5563;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            transition: background-color 0.2s ease;
        }

        .icon-btn.delete {
            background-color: var(--danger);
        }

        .icon-btn.delete:hover {
            background-color: #b91c1c;
        }

        /* ===== 検索バー ===== */
        .search-bar {
            margin: 16px 0;
        }

        .search-bar input {
            width: 300px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #0d6efd;
        }

        /* ===== 検索結果件数 ===== */
        .result-count {
            margin-top: 8px;
            font-size: 13px;
            color: #555;
        }
    </style>



</head>

<body>

    <h1>部署一覧</h1>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="部署名で検索">
    </div>

    <div id="resultCount" class="result-count">
        全件表示中
    </div>



    <div th:if="${message}" style="
        margin-bottom:16px;
        padding:10px 14px;
        background-color:#e6fffa;
        border:1px solid #b2f5ea;
        color:#065f46;
        border-radius:4px;
     ">
        <span th:text="${message}"></span>
    </div>

    <a th:href="@{/departments/new}" class="btn btn-primary">
        ＋ 新規部署登録
    </a>

    <table>
        <tr>
            <th>ID</th>
            <th onclick="sortTable()">部署名 ▲▼</th>
            <th>操作</th>
        </tr>

        <tr th:each="dept : ${departments}" class="dept-row">
            <td th:text="${dept.id}"></td>
            <td th:text="${dept.departmentName}"></td>
            <td class="action-links">
                <a th:href="@{/departments/edit/{id}(id=${dept.id})}" class="btn btn-edit">
                    編集
                </a>


                <button class="btn btn-delete" th:onclick="|confirmDelete(${dept.id})|" title="削除">
                    🗑
                </button>
            </td>
        </tr>
    </table>

    <p class="footer-link">
        <a th:href="@{/dashboard}">ダッシュボードに戻る</a>
    </p>

    <script>
        const searchInput = document.getElementById("searchInput");
        const rows = document.querySelectorAll(".dept-row");
        const resultCount = document.getElementById("resultCount");

        function updateCount() {
            const visibleRows = Array.from(rows).filter(
                row => row.style.display !== "none"
            );
            resultCount.textContent = `${visibleRows.length} 件表示中`;
        }

        searchInput.addEventListener("keyup", function () {
            const keyword = this.value.toLowerCase();

            rows.forEach(row => {
                const deptName = row.children[1].innerText.toLowerCase();
                row.style.display = deptName.includes(keyword) ? "" : "none";
            });

            updateCount();
        });

        updateCount();

        let sortAsc = true;

        function sortTable() {
            const tbody = document.querySelector("table tbody") || document.querySelector("table");
            const rowsArray = Array.from(rows);

            rowsArray.sort((a, b) => {
                const nameA = a.children[1].innerText;
                const nameB = b.children[1].innerText;
                return sortAsc ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
            });

            sortAsc = !sortAsc;
            rowsArray.forEach(row => tbody.appendChild(row));
        }
    </script>



</body>

</html>
