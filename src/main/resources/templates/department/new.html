<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>新規部署登録</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 40px;
        }

        .form-card {
            width: 420px;
            margin: auto;
            padding: 28px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input {
            border: 1px solid var(--gray-300);
            padding: 10px;
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }


        button {
            width: 100%;
            padding: 10px;
            background-color: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b5ed7;
        }

        .back {
            margin-top: 16px;
            display: block;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="form-card">
        <h1>新規部署登録</h1>

        <form th:action="@{/departments}" th:object="${department}" method="post">
            <label>
                部署名 <span style="color:red">*</span>
            </label>
            <input type="text" placeholder="例：総務部"  th:field="*{departmentName}" required>


            <div th:if="${#fields.hasErrors('departmentName')}" style="color:red; margin-top:8px;">
                <span th:errors="*{departmentName}"></span>
            </div>

            <button type="submit">登録</button>
        </form>

        <a th:href="@{/departments}" class="back">← 一覧に戻る</a>
    </div>

</body>

</html>
